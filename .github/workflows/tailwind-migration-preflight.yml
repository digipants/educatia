name: Tailwind v4 migration preflight

on:
  push:
    branches:
      - wip/tailwind4-educatia
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailwind-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_APPLICATIONS_ENABLED: 'false'
      APPLICATION_STORAGE_ENABLED: 'false'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate lockfile for migration
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install exact new dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Compile production build
        run: npm run build

      - name: Collect full audit
        if: always()
        run: npm audit --json > audit.json || true

      - name: Check production advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload generated lockfile and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwind4-lockfile-audit
          path: |
            package-lock.json
            audit.json
          if-no-files-found: warn
          retention-days: 3

      - name: Install Chromium browser for visual snapshots
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Start local production server
        run: |
          npm run start -- -p 3000 > /tmp/educatia-tailwind-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 100 /tmp/educatia-tailwind-preview.log
          exit 1

      - name: Capture production-vs-migration screenshots
        run: |
          mkdir -p visual-checks
          for route in home:/ programs:/programs contact:/contact donate:/donate admin:/admin/applications; do
            name="${route%%:*}"
            urlpath="${route#*:}"
            for viewport in 1440,900 390,844; do
              case "$viewport" in
                1440,900) suffix=desktop ;;
                390,844) suffix=mobile ;;
              esac
              npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "$viewport" --full-page --wait-for-timeout 1600 "https://educatiawelfaretrust.org${urlpath}" "visual-checks/${name}-baseline-${suffix}.png"
              npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "$viewport" --full-page --wait-for-timeout 1600 "http://127.0.0.1:3000${urlpath}" "visual-checks/${name}-tailwind4-${suffix}.png"
            done
          done

      - name: Upload visual comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwind4-visual-comparisons
          path: visual-checks/
          if-no-files-found: warn
          retention-days: 3
